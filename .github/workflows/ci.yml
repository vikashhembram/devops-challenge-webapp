name: Application CI


on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read


jobs:
  test-and-build:
    name: Test applicaton and build image
    runs-on: ubuntu-latest
    timeout-minutes: 10


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: docker build --tag devops-challenge:${{github.sha}} .

