name: Application CI


on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read


jobs:
  test-and-build:
    name: Test applicaton and build image
    runs-on: ubuntu-latest
    timeout-minutes: 10


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: docker build --pull --tag devops-challenge:${{github.sha}} .
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devops-challenge:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"


      - name: Log into Docker
        if: github.event.name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
              username: ${{vars.DOCKERHUB_USERNAME}}
              password: ${{secrets.DOCKERHUB_PASSWORD}}

      - name: Tag and push verified image
        if: github.event.name == 'push' && github.ref == 'refs/heads/main'
        env:
            DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
        run: |
            IMAGE: "${DOCKERHUB_USERNAME}/devops-challenge:${GITHUB_SHA}
            docker tag "devops-challenge:${GITHUB_SHA}" "$IMAGE"
            docker push "$IMAGE"
